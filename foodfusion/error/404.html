<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | FoodFusion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #faf3e0 0%, #fff 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .error-container {
            max-width: 600px;
            padding: 40px;
        }
        h1 {
            font-size: 8rem;
            font-weight: 700;
            color: #e07a5f;
            margin: 0;
            line-height: 1;
        }
        h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        p {
            color: #6c757d;
            margin-bottom: 30px;
        }
        .btn-primary {
            background: #e07a5f;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            text-decoration: none;
            color: white;
            display: inline-block;
        }
        .btn-primary:hover {
            background: #c46b4f;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <a href="/foodfusion/" class="btn-primary">Back to Homepage</a>
    </div>
</body>
</html>
