services:
  - type: web
    name: artstudio
    runtime: node
    rootDir: artstudio
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: ORDER_EMAIL
        sync: false
      - key: ORDER_FROM_EMAIL
        sync: false